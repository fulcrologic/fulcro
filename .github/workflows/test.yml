name: Clojure CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clj:
    name: Clojure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.0.1530'
      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-clj-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-
      - name: Run CLJ tests
        run: clojure -A:dev:test:clj-tests -J-Dguardrails.enabled=true -J-Dguardrails.config=guardrails-test.edn -J-Dcom.fulcrologic.fulcro.inspect=true

  cljs:
    name: ClojureScript tests (karma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: browser-actions/setup-chrome@v1
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.0.1530'
      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-cljs-${{ hashFiles('**/deps.edn') }}-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-cljs-
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Compile CLJS tests
        run: pnpm exec shadow-cljs -A:dev -v compile ci-tests
        env:
          CHROME_BIN: ${{ env.CHROME_BIN }}
      - name: Run karma
        run: pnpm exec karma start --single-run

  cljdoc:
    name: cljdoc analyzer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.0.1530'
      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-cljdoc-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-cljdoc-
      - name: Build jar
        run: clojure -T:build jar
      - name: Check CljDoc
        uses: cljdoc/cljdoc-check-action@v0.0.3
